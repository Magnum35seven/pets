name: Scrape pet food prices

on:
  schedule:
    # Runs at 17:00 UTC every Thursday (3:00 AM AEST every Friday)
    - cron: '0 17 * * 4'
  workflow_dispatch: # Allows manual trigger from the Actions tab anytime

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f scraper/requirements.txt ]; then pip install -r scraper/requirements.txt; fi

      - name: Run scraper
        run: python scraper/scrape_all.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/latest.json
          git status
          git diff-index --quiet HEAD || git commit -m "Automated price scrape update"
          git push
