<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pet Products — Pet Price Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="header-container">
      <div class="logo">
        <span class="logo-accent">PET</span>//PRODUCTS
      </div>
      <nav class="tab-nav" role="tablist">
        <button class="tab-btn is-active" data-tab="search" role="tab" aria-selected="true">Search</button>
        <button class="tab-btn" data-tab="movers" role="tab" aria-selected="false">Price movers</button>
      </nav>
    </div>
  </header>

  <main>
    <section id="tab-search" class="tab-panel is-active">
      <!-- Category Filter Buttons -->
      <div class="category-filters" style="margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap;">
        <button class="cat-btn active" data-category="all">All</button>
        <button class="cat-btn" data-category="food">Food</button>
        <button class="cat-btn" data-category="treat">Treats</button>
        <button class="cat-btn" data-category="accessory">Accessories &amp; Toys</button>
      </div>

      <!-- Search & Grouping Controls -->
      <div class="search-bar">
        <input id="search-input" type="search" placeholder='Search e.g. "dry dog food chicken", "pigs ears"…' />
        <select id="sort-select">
          <option value="unit_price">Sort: cheapest per kg/L</option>
          <option value="price">Sort: cheapest total price</option>
          <option value="discount">Sort: biggest discount</option>
        </select>
        <label style="display: flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; white-space: nowrap;">
          <input id="group-toggle" type="checkbox" /> Group identical items
        </label>
      </div>

      <div id="result-meta" class="result-meta"></div>

      <div id="results-list" class="results-grid"></div>

      <div id="empty-state" class="empty-state" hidden>
        <p>No matching products found.</p>
      </div>
    </section>

    <section id="tab-movers" class="tab-panel">
      <h2>Price Movers</h2>
      <div class="movers-container">
        <div class="movers-column">
          <h3>Recent Price Drops</h3>
          <ul id="drops-list" class="movers-list"></ul>
        </div>
        <div class="movers-column">
          <h3>Recent Price Rises</h3>
          <ul id="rises-list" class="movers-list"></ul>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div id="last-updated">Loading tracker status...</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
