<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Kibble Compare — pet food price tracker</title>
<meta name="theme-color" content="#171512" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="site-header">
  <div class="brand">
    <span class="brand-mark">KIBBLE<span class="brand-mark-accent">//</span>COMPARE</span>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab-btn is-active" data-tab="search" role="tab" aria-selected="true">Search</button>
    <button class="tab-btn" data-tab="movers" role="tab" aria-selected="false">Price movers</button>
  </nav>
</header>

<main>

  <section id="tab-search" class="tab-panel is-active">
    <div class="search-bar">
      <input id="search-input" type="search" inputmode="search"
             placeholder="Search e.g. “dry dog food chicken”, “kitten wet food”…"
             autocomplete="off" />
      <select id="sort-select">
        <option value="unit_price">Sort: cheapest per kg/L</option>
        <option value="price">Sort: cheapest total price</option>
        <option value="discount">Sort: biggest discount</option>
      </select>
    </div>

    <p id="result-meta" class="result-meta"></p>

    <ul id="results-list" class="docket-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty-state" hidden>No matches yet — try a broader term, or check back after the next scrape.</p>
  </section>

  <section id="tab-movers" class="tab-panel">
    <p class="section-intro">Products whose price shifted a lot since the last scrape — the "Down Down" checker.</p>
    <ul id="movers-list" class="docket-list"></ul>
    <p id="movers-empty" class="empty-state" hidden>No notable price movements recorded yet.</p>
  </section>

</main>

<footer class="site-footer">
  <span id="last-updated">—</span>
</footer>

<script src="app.js"></script>
</body>
</html>
