name: Scrape pet food prices

on:
  schedule:
    # 20:00 UTC = 6am AEST / 7am AEDT — runs once daily, well outside store peak hours
    - cron: "0 20 * * *"
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python scraper/scrape_all.py

      - name: Commit updated data
        run: |
          git config user.name "pet-price-bot"
          git config user.email "actions@github.com"
          git add frontend/data/
          git diff --quiet --cached || git commit -m "Scrape update $(date -u +%Y-%m-%d)"
          git push
